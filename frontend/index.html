<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Puffles — NFT Platform on Push Chain</title>
<script>
  // Fallback router — if _redirects fails during a deploy, catch it here
  (function(){
    var p = window.location.pathname;
    var m;
    if ((m = p.match(/^\/mint(?:\/(.+))?$/))) {
      window.location.replace('/app/mint' + (m[1] ? '?slug=' + encodeURIComponent(m[1]) : ''));
      return;
    }
    if ((m = p.match(/^\/collection(?:\/(.+))?$/))) {
      window.location.replace('/app/collection' + (m[1] ? '?slug=' + encodeURIComponent(m[1]) : ''));
      return;
    }
  })();
</script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a0a0f; color: #e8e4f0; font-family: 'Space Mono', monospace;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    justify-content: center; overflow: hidden; position: relative;
  }
  .orb1 { position: fixed; width: 600px; height: 600px; border-radius: 50%; background: radial-gradient(circle, rgba(221,107,255,.12) 0%, transparent 70%); top: -200px; right: -150px; filter: blur(80px); animation: f1 12s ease-in-out infinite; pointer-events: none; }
  .orb2 { position: fixed; width: 500px; height: 500px; border-radius: 50%; background: radial-gradient(circle, rgba(107,148,255,.1) 0%, transparent 70%); bottom: -150px; left: -100px; filter: blur(60px); animation: f2 15s ease-in-out infinite; pointer-events: none; }
  @keyframes f1 { 0%,100% { transform: translate(0,0) } 50% { transform: translate(-30px,40px) } }
  @keyframes f2 { 0%,100% { transform: translate(0,0) } 50% { transform: translate(40px,-30px) } }
  .grid { position: fixed; inset: 0; background-image: linear-gradient(rgba(221,107,255,.03) 1px, transparent 1px), linear-gradient(90deg, rgba(221,107,255,.03) 1px, transparent 1px); background-size: 60px 60px; pointer-events: none; }
  .content { position: relative; z-index: 1; text-align: center; padding: 40px 20px; max-width: 600px; }
  .logo { margin-bottom: 24px; } .logo img { width: 80px; height: 80px; border-radius: 20px; box-shadow: 0 0 40px rgba(221,107,255,0.3); }
  h1 { font-family: 'Space Grotesk', sans-serif; font-size: 48px; font-weight: 800; letter-spacing: -.03em; line-height: 1.1; background: linear-gradient(135deg, #fff 0%, #dd6bff 50%, #6b94ff 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 12px; }
  .sub { color: rgba(232,228,240,.5); font-size: 14px; line-height: 1.6; margin-bottom: 40px; }
  .nav { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
  .nav a {
    display: inline-flex; align-items: center; gap: 8px; padding: 14px 28px;
    border-radius: 100px; font-family: 'Space Grotesk', sans-serif;
    font-size: 15px; font-weight: 700; text-decoration: none; transition: all .3s;
  }
  .primary { background: linear-gradient(135deg, #dd6bff, #6b94ff); color: #fff; }
  .primary:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(221,107,255,.35); }
  .secondary { background: transparent; color: #dd6bff; border: 1px solid rgba(221,107,255,.3); }
  .secondary:hover { background: rgba(221,107,255,.08); border-color: rgba(221,107,255,.5); }
  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 100px; border: 1px solid rgba(221,107,255,.2); background: rgba(221,107,255,.06); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: #dd6bff; font-weight: 700; margin-bottom: 24px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #dd6bff; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }
  .coming { margin-top: 48px; padding: 20px 32px; border: 1px solid rgba(221,107,255,.1); border-radius: 16px; background: rgba(221,107,255,.03); }
  .coming h3 { font-family: 'Space Grotesk', sans-serif; font-size: 16px; color: #dd6bff; margin-bottom: 8px; }
  .coming p { font-size: 12px; color: rgba(232,228,240,.4); line-height: 1.5; }
  footer { position: fixed; bottom: 20px; font-size: 11px; color: rgba(232,228,240,.2); }
  footer a { color: rgba(221,107,255,.4); text-decoration: none; }
</style>
</head>
<body>
  <div class="orb1"></div>
  <div class="orb2"></div>
  <div class="grid"></div>
  <div class="content">
    <div class="badge"><span class="dot"></span> Push Chain Testnet</div>
    <div class="logo"><img src="/puffles-logo.png" alt="Puffles" /></div>
    <h1>Puffles</h1>
    <p class="sub">The NFT platform for Push Chain. Launch collections, mint NFTs, and trade.</p>
    <div class="nav">
      <a href="/launch" class="primary">🚀 Launchpad</a>
      <a href="#" class="secondary">🏪 Marketplace</a>
    </div>
    <div class="coming">
      <h3>Marketplace — Coming Soon</h3>
      <p>Trade NFTs across Push Chain collections. List, bid, and discover.</p>
    </div>
  </div>
  <footer>Built on <a href="https://push.org" target="_blank">Push Chain</a></footer>
</body>
</html>
